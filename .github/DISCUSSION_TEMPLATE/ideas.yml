title: "[Idea] "
labels: ["idea", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Ideas & Feature Proposals

        Got an idea for improving an existing project, adding a new capability, or changing how something works? This is the right place.

        **Before you post:** Check that a similar idea hasn't already been proposed. A well-reasoned, concrete proposal has a much higher chance of going somewhere than a vague wish.

        For infrastructure changes: frame the problem in GitOps terms — what manifest, chart, or Flux resource needs to change, and why?

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or limitation you're running into. Ideas rooted in real problems are taken more seriously than abstract feature requests.
      placeholder: "Currently, it's not possible to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Be as specific as you can — a sketch of the approach, affected files, or a rough design is very helpful.
      placeholder: "I think we could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other approaches? Why is your proposal better?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which project or area is this for?
      options:
        - homelab-cluster (GitOps / Kubernetes)
        - AI / ML tooling
        - Observability / monitoring
        - Web applications
        - DevOps tooling / pipelines
        - Organisation-wide
        - New project idea
        - Other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Estimated impact
      options:
        - Small (quality of life improvement)
        - Medium (meaningfully changes a workflow)
        - Large (architectural or cross-cutting change)
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before posting
      options:
        - label: I've searched existing discussions and issues for duplicates
          required: true
        - label: I'm willing to contribute to implementing this if it's accepted
          required: false
