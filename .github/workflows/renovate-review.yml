# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Reusable workflow — call from any repo with:
#
#   jobs:
#     review:
#       uses: webgrip/.github/.github/workflows/renovate-review.yml@main
#       secrets: inherit
#
# No secrets required — uses GITHUB_TOKEN only.
# The prompt is sourced from webgrip/.github; no local copy needed.
name: Renovate PR Review (reusable)

on:
  workflow_call: {}

jobs:
  review:
    name: AI dependency review
    runs-on: arc-runner-set

    permissions:
      contents: read        # checkout prompt + fetch diff
      pull-requests: write  # post comment
      models: read          # GitHub Models inference

    steps:
      - name: Run renovate review
        uses: webgrip/.github/actions/renovate-review@main
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          repository: ${{ github.repository }}
