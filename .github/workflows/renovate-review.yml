# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Reusable workflow — call from any repo with:
#
#   jobs:
#     review:
#       if: |
#         github.event.pull_request.user.login == 'renovate[bot]' ||
#         github.event.pull_request.user.login == 'dependabot[bot]'
#       uses: webgrip/.github/.github/workflows/renovate-review.yml@main
#       secrets: inherit
#
# Required org secret: COPILOT_PAT
#   Classic PAT (repo scope) from a Copilot Business/Enterprise licensed user.
#   The Copilot agent assignment API requires a user token — GITHUB_TOKEN won't work.
name: Renovate PR Review (reusable)

on:
  workflow_call: {}

jobs:
  assign-copilot:
    name: Assign Copilot renovate-reviewer
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Assign Copilot with renovate-reviewer agent
        env:
          GH_TOKEN: ${{ secrets.COPILOT_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/issues/${PR_NUMBER}/assignees" \
            --input - <<< '{
              "assignees": ["copilot-swe-agent[bot]"],
              "agent_assignment": {
                "target_repo": "'"${REPO}"'",
                "custom_agent": "renovate-reviewer",
                "custom_instructions": "This is an automated Renovate/Dependabot dependency update PR. Use the renovate-reviewer custom agent. Produce a supply-chain risk assessment comment only. Do NOT make code changes, do NOT push commits, do NOT create branches, do NOT approve or merge the PR."
              }
            }'
