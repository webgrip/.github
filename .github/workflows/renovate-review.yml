# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Reusable workflow — call from any repo with:
#
#   jobs:
#     review:
#       uses: webgrip/.github/.github/workflows/renovate-review.yml@main
#       secrets: inherit
#
# Requires:
# - Actions org/repo secret `COPILOT_AGENT_TOKEN` for assigning Copilot.
# - Copilot Agents org/repo secret `COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN`
#   for the renovate-reviewer writable GitHub MCP server.
name: Renovate PR Review (reusable)

on:
  workflow_call:
    secrets:
      COPILOT_AGENT_TOKEN:
        required: true

concurrency:
  group: renovate-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI dependency review
    runs-on: arc-runner-set

    permissions:
      contents: read       # fetch PR context
      issues: write        # create Copilot agent tracking issue
      pull-requests: read  # read PR metadata

    steps:
      - name: Run renovate review
        uses: webgrip/.github/actions/renovate-review@main
        with:
          agent-token: ${{ secrets.COPILOT_AGENT_TOKEN }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          repository: ${{ github.repository }}
