# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Reusable workflow — call from any repo with:
#
#   jobs:
#     review:
#       uses: webgrip/.github/.github/workflows/renovate-review.yml@main
#       secrets: inherit
#
# Requires org/repo Actions secret: COPILOT_AGENT_TOKEN
name: Renovate PR Review (reusable)

on:
  workflow_call:
    secrets:
      COPILOT_AGENT_TOKEN:
        required: true

concurrency:
  group: renovate-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Dispatch AI dependency reviewer
    runs-on: arc-runner-set

    permissions:
      contents: read
      issues: write        # create and close tracking issues
      pull-requests: read

    steps:
      - uses: webgrip/.github/actions/renovate-review@main
        with:
          agent-token: ${{ secrets.COPILOT_AGENT_TOKEN }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          pr-number: ${{ github.event.pull_request.number }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-author: ${{ github.event.pull_request.user.login }}
          repository: ${{ github.repository }}
