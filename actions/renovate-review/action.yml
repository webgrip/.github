# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Renovate AI Review
description: >
  Creates a tracking issue and assigns the renovate-reviewer Copilot cloud agent.
  The agent researches the PR and posts its review as a comment on the tracking
  issue. A separate publish workflow relays that comment to the Renovate PR.

inputs:
  agent-token:
    description: >
      User token used to assign Copilot cloud agent (requires actions, contents,
      issues, and pull-requests permissions).
    required: true
  agent-name:
    description: Custom Copilot agent profile name to use.
    required: false
    default: renovate-reviewer
  base-ref:
    description: Pull request base branch for Copilot agent assignment.
    required: false
    default: main
  pr-number:
    description: Pull request number.
    required: true
  pr-title:
    description: Pull request title.
    required: true
  pr-author:
    description: GitHub login of the PR author.
    required: true
  repository:
    description: Repository in owner/name format.
    required: true

runs:
  using: composite
  steps:
    - name: Create tracking issue and dispatch Copilot reviewer
      uses: actions/github-script@v7
      env:
        AGENT_TOKEN: ${{ inputs.agent-token }}
        AGENT_NAME: ${{ inputs.agent-name }}
        BASE_REF: ${{ inputs.base-ref }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_AUTHOR: ${{ inputs.pr-author }}
        REPO: ${{ inputs.repository }}
      with:
        github-token: ${{ inputs.agent-token }}
        script: |
          const [repoOwner, repoName] = process.env.REPO.split('/');
          const prNumber  = Number(process.env.PR_NUMBER);
          const prTitle   = process.env.PR_TITLE;
          const prAuthor  = process.env.PR_AUTHOR;
          const baseRef   = process.env.BASE_REF;
          const agentName = process.env.AGENT_NAME;
          const repo      = process.env.REPO;

          // Fetch PR context
          const { data: pr } = await github.rest.pulls.get({
            owner: repoOwner, repo: repoName, pull_number: prNumber,
          });
          const prUrl  = pr.html_url;
          const prBody = (pr.body || '_No PR body._').slice(0, 3000);

          const { data: prFiles } = await github.rest.pulls.listFiles({
            owner: repoOwner, repo: repoName, pull_number: prNumber, per_page: 80,
          });
          const filesList = prFiles
            .map(f => `- \`${f.filename}\` (+${f.additions}/-${f.deletions})`)
            .join('\n');

          // Close stale tracking issues for this PR
          const marker = `renovate-agent-review:${repo}#${prNumber}`;
          const stale = await github.rest.search.issuesAndPullRequests({
            q: `repo:${repo} is:issue is:open "${marker}"`,
          });
          for (const issue of stale.data.items) {
            await github.rest.issues.createComment({
              owner: repoOwner, repo: repoName, issue_number: issue.number,
              body: 'Superseded by a newer review dispatch.',
            });
            await github.rest.issues.update({
              owner: repoOwner, repo: repoName, issue_number: issue.number,
              state: 'closed',
            });
          }

          // Build issue body
          const body = [
            `# Renovate dependency review task`,
            ``,
            `Marker: \`${marker}\``,
            ``,
            `Review pull request: ${prUrl}`,
            `Repository: \`${repo}\``,
            `Pull request number: ${prNumber}`,
            `Title: ${prTitle}`,
            `Author: @${prAuthor}`,
            `Base branch: \`${baseRef}\``,
            ``,
            `## Your task`,
            ``,
            `Use the \`${agentName}\` agent instructions to produce a dependency update risk assessment for **PR #${prNumber}** in \`${repo}\`.`,
            ``,
            `Do not create branches, commits, or pull requests. Do not close this tracking issue.`,
            ``,
            `## How to research`,
            ``,
            `1. Fetch live PR metadata, diff, and changed files via \`gh api\` or the \`github/*\` tools.`,
            `2. Read relevant repository files — find every place this dependency is used.`,
            `3. Look up upstream release notes. Use \`execute\` to \`curl\` wherever the info lives:`,
            `   - GitHub releases API for GitHub-hosted projects`,
            `   - Docker Hub API (\`https://hub.docker.com/v2/repositories/<image>/tags\`) for container images`,
            `   - npm, PyPI, crates.io, ArtifactHub, or the project's own changelog/release page`,
            `   - Check ALL versions between old and new, not just the latest`,
            `4. Write the review following the format in the \`${agentName}\` agent profile.`,
            `5. Post your review as a PR review comment — this is the ONLY write action:`,
            `   \`\`\``,
            `   gh pr review ${prNumber} --repo ${repo} --comment --body-file review.md`,
            `   \`\`\``,
            `   Use \`gh pr review\` (NOT \`gh pr comment\` or \`gh issue comment\`).`,
            ``,
            `## Initial changed files`,
            ``,
            filesList,
            ``,
            `## Renovate PR body (contains changelog links — follow them)`,
            ``,
            prBody,
          ].join('\n');

          // Create tracking issue
          let issueTitle = `Renovate agent review for #${prNumber}: ${prTitle}`;
          if (issueTitle.length > 240) issueTitle = issueTitle.slice(0, 237) + '...';

          const { data: issue } = await github.rest.issues.create({
            owner: repoOwner, repo: repoName,
            title: issueTitle,
            body,
          });
          const issueNumber = issue.number;
          console.log(`Created tracking issue #${issueNumber}`);

          // Assign Copilot cloud agent (two-step: create then assign)
          const customInstructions = `You are the ${agentName} agent. Research the dependency update for PR #${prNumber} in ${repo}. Post your complete review using: gh pr review ${prNumber} --repo ${repo} --comment --body-file review.md. Use gh pr review, NOT gh pr comment or gh issue comment. Do NOT create branches or pull requests.`;

          await github.request(
            'POST /repos/{owner}/{repo}/issues/{issue_number}/assignees',
            {
              owner: repoOwner,
              repo: repoName,
              issue_number: issueNumber,
              assignees: ['copilot-swe-agent[bot]'],
              agent_assignment: {
                target_repo: repo,
                base_branch: baseRef,
                custom_agent: agentName,
                custom_instructions: customInstructions,
              },
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            }
          );

          console.log(`Dispatched ${agentName} → ${issue.html_url}`);
