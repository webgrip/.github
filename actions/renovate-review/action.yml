# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Renovate AI Review
description: >
  Reviews dependency update pull requests: fetches live PR context, calls
  GitHub Models to generate a risk assessment, and posts it as a PR comment.

inputs:
  github-token:
    description: >
      Token with pull-requests:write and models:read permissions.
      Use the job GITHUB_TOKEN.
    required: true
  pr-number:
    description: Pull request number to review.
    required: true
  repository:
    description: Repository in owner/name format.
    required: true
  model:
    description: GitHub Models model ID to use.
    required: false
    default: openai/gpt-4.1

runs:
  using: composite
  steps:
    - name: Generate and post dependency review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ inputs.repository }}
        MODEL: ${{ inputs.model }}
        SENTINEL: "<!-- renovate-ai-review -->"
      run: |
        set -euo pipefail

        # ── 1. Fetch live PR context ───────────────────────────────────────────
        pr_json=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}")
        pr_url=$(   echo "${pr_json}" | jq -r '.html_url')
        pr_title=$( echo "${pr_json}" | jq -r '.title')
        pr_author=$(echo "${pr_json}" | jq -r '.user.login')
        pr_labels=$(echo "${pr_json}" | jq -r '[.labels[].name] | join(", ")')
        pr_body=$(  echo "${pr_json}" | jq -r '.body // "_No description._"' | head -c 2000)

        files=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/files" \
          --jq '.[:60] | .[] | "- `\(.filename)` +\(.additions)/-\(.deletions) [\(.status)]"')

        diff=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" \
          -H "Accept: application/vnd.github.v3.diff" 2>/dev/null \
          | head -c 8000 || echo "(diff unavailable)")

        # ── 2. Call GitHub Models ──────────────────────────────────────────────
        payload=$(jq -n \
          --arg model  "${MODEL}" \
          --arg system "You are a supply-chain risk assessor reviewing dependency update pull requests. Be concise, factual, and actionable. Do not fabricate version history, CVEs, or release notes you cannot verify from the provided context." \
          --arg user   "## PR: ${pr_title}
Repository: ${REPO}  |  PR #${PR_NUMBER}
Author: @${pr_author}  |  Labels: ${pr_labels:-none}
URL: ${pr_url}

## Changed files
${files}

## Diff (first 8 KB)
\`\`\`diff
${diff}
\`\`\`

## PR body
${pr_body}

---
Produce a risk assessment with this structure:

**Verdict:** Green / Yellow Caution / Red Block
**Recommendation:** Merge / Merge after checks / Do not merge
**Confidence:** High / Medium / Low

### What changed
Dependency name, old → new version, update type.

### Upstream changes
Breaking changes, migration notes, security fixes between the two versions.

### Local impact
How this dependency is used in this repo; which workloads or services are affected.

### Pre-merge checks
Concrete, actionable items the reviewer should verify before merging.

### Risk rationale
Why you assigned the verdict above." \
          '{
            model: $model,
            messages: [
              {role: "system", content: $system},
              {role: "user",   content: $user}
            ],
            max_tokens: 1500
          }')

        response=$(curl -sf \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Content-Type: application/json" \
          "https://models.inference.ai.azure.com/chat/completions" \
          -d "${payload}")

        review=$(echo "${response}" | jq -r '.choices[0].message.content // empty')

        if [ -z "${review}" ]; then
          echo "::error::Models API returned no content: $(echo "${response}" | jq -c .)"
          exit 1
        fi

        # ── 3. Post or update the PR comment ──────────────────────────────────
        comment_body="${SENTINEL}
${review}"

        existing_id=$(gh api "/repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq "[.[] | select(.body | startswith(\"${SENTINEL}\"))][0].id // empty")

        if [ -n "${existing_id}" ]; then
          gh api --method PATCH \
            "/repos/${REPO}/issues/comments/${existing_id}" \
            -f body="${comment_body}" --silent
          echo "Updated review comment (ID ${existing_id}) on ${pr_url}"
        else
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${comment_body}"
          echo "Posted review comment on ${pr_url}"
        fi

runs:
  using: composite
  steps:
    - name: Dispatch Copilot renovate reviewer
      shell: bash
      env:
        AGENT_TOKEN: ${{ inputs.agent-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_AUTHOR: ${{ inputs.pr-author }}
        REPO: ${{ inputs.repository }}
        BASE_REF: ${{ inputs.base-ref }}
        AGENT_NAME: ${{ inputs.agent-name }}
        REVIEW_SENTINEL: "<!-- renovate-ai-review -->"
      run: |
        : "${AGENT_TOKEN:?missing agent-token input}"
        export GH_TOKEN="${AGENT_TOKEN}"

        marker="renovate-agent-review:${REPO}#${PR_NUMBER}"
        pr_url="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.html_url')"
        pr_body="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // "_No PR body._"')"
        files="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}/files" \
          --jq '.[] | "- `\(.filename)` (+\(.additions) -\(.deletions))"' \
          | head -50)"

        stale_issues="$(gh api --method GET /search/issues \
          -f q="repo:${REPO} is:issue is:open \"${marker}\"" \
          --jq '.items[].number')"

        if [ -n "${stale_issues}" ]; then
          while IFS= read -r stale_issue; do
            [ -z "${stale_issue}" ] && continue
            gh issue close "${stale_issue}" \
              --repo "${REPO}" \
              --comment "Superseded by a newer Renovate agent review dispatch for ${pr_url}."
          done <<< "${stale_issues}"
        fi

        body_file="$(mktemp)"
        cleanup() {
          rm -f "${body_file}"
        }
        trap cleanup EXIT

        cat > "${body_file}" <<EOF
        # Renovate dependency review task

        Marker: \`${marker}\`

        Review pull request: ${pr_url}
        Repository: \`${REPO}\`
        Pull request: #${PR_NUMBER}
        Title: ${PR_TITLE}
        Author: @${PR_AUTHOR}
        Base branch: \`${BASE_REF}\`

        ## Task

        Use the \`${AGENT_NAME}\` custom agent instructions to produce the dependency update review for the linked pull request.

        Do not rely only on the context in this issue. Fetch the live PR metadata, changed files, diff, relevant repository files, and upstream release notes/changelogs/advisories yourself before writing the review.

        To post or update the PR comment use the \`github-writer\` MCP tools. Do not create a pull request, branch, or commit — not even as a fallback if posting the comment fails. If you cannot post the comment, add a comment to this tracking issue explaining why.

        Post or update exactly one comment on ${pr_url}. The first line of the comment body must be the literal sentinel \`${REVIEW_SENTINEL}\`.

        If a PR comment containing that sentinel already exists, update it instead of creating a duplicate.

        Do not modify repository files, push commits, open a code-change pull request, approve, merge, close, or retitle the pull request.

        After posting or updating the PR comment, close this tracking issue as completed.

        ## Initial changed files snapshot

        ${files}

        ## Initial PR body snapshot

        ${pr_body}
        EOF

        custom_instructions="Use the ${AGENT_NAME} custom agent. Post or update one PR comment with the ${REVIEW_SENTINEL} sentinel using the github-writer MCP tools. Close the tracking issue when done. Do NOT create a pull request or branch under any circumstances, even as a fallback."
        issue_title="Renovate agent review for #${PR_NUMBER}: ${PR_TITLE}"
        if [ "${#issue_title}" -gt 240 ]; then
          issue_title="${issue_title:0:237}..."
        fi

        issue_number="$(gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/${REPO}/issues" \
          -f title="${issue_title}" \
          -F body="@${body_file}" \
          --jq '.number')"

        gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/${REPO}/issues/${issue_number}/assignees" \
          -f 'assignees[]=copilot-swe-agent[bot]' \
          -f "agent_assignment[target_repo]=${REPO}" \
          -f "agent_assignment[base_branch]=${BASE_REF}" \
          -f "agent_assignment[custom_agent]=${AGENT_NAME}" \
          -f "agent_assignment[custom_instructions]=${custom_instructions}" \
          --silent

        issue_url="https://github.com/${REPO}/issues/${issue_number}"

        echo "Dispatched ${AGENT_NAME} via ${issue_url}"
